<div class="bc-container-fluid bc-pe-4">
  <div class="bc-row bc-align-items-center bc-mt-3">
    <div class="bc-col-12 bc-d-flex bc-align-items-center mobile-header-filex">
      <bc-breadcrumb-v2 [breadcrumbItems]="breadcrumbItems"></bc-breadcrumb-v2>
      <div class="bc-col bc-flex bc-justify-content-end">
        <div id="download-balance-button" aria-label="Descargar" role="button">
          @if (currentProductSummary?.status?.code === 200) {
            <bc-tag
              componentId="downloadBalancesBtn"
              textElement="Descargar consolidados"
              (keyup.space)="generateSummaryFilexPDF()"
              (keyup.enter)="generateSummaryFilexPDF()"
              (click)="generateSummaryFilexPDF()"
              role="button"
              aria-label="Descargar consolidados"
              iconLeft="download-file"
              typeTag="button">
            </bc-tag>
          }
        </div>

        @if (currentProductSummary?.status?.code === 200) {
          <bc-icon-button
            class="bc-ms-2"
            aria-label="Actualizar página"
            type="solid"
            color="white"
            [shadow]="true"
            size="xsmall"
            customIcon="refresh"
            bc-tooltip
            bcTooltipPosition="bottom"
            bcTooltipText="Actualizar"
            (click)="refreshData()"
            (keyup.space)="refreshData()"
            (keyup.enter)="refreshData()">
          </bc-icon-button>
        }
      </div>
    </div>
  </div>
  <div class="bc-row bc-mt-2">
    <bc-icon
      class="bc-ms-3"
      size="sm"
      name="arrow-left"
      routerLink="/home/filex"
      (keydown.space)="('/home/filex')"
      bc-tooltip
      bcTooltipPosition="bottom"
      bcTooltipText="Regresar"
      aria-label="Regresar a la pagina anterior">
    </bc-icon>
    <h3 tabindex="0" class="bc-col bc-mb-3">Consolidados por producto</h3>
  </div>
  <svn-filex-balances (eventoOnRetry)="onRetryComponent()"></svn-filex-balances>
</div>
<bc-circle-loading [text]="titleLoader" accessibilityLabel="" speedLoader="0.9"> </bc-circle-loading>
